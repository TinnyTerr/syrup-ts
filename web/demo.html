<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Syrup Demo</title>
    <style>
      body {
        margin: 0;
        padding: 1rem;
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 960px;
        margin: 0 auto;
      }
      textarea {
        width: 100%;
        min-height: 16rem;
        font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      pre {
        white-space: pre-wrap;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        padding: 1rem;
        background: #f6f8fa;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Syrup playground</h1>
      <p>Run Syrup source code in the browser using the ESM build.</p>
      <textarea id="source">x, y := xor.
? x.</textarea>
      <p><button id="run" type="button">Run</button></p>
      <pre id="output"></pre>
    </main>
    <script type="module">
      import { run } from "./syrup.esm.js";

      const source = document.getElementById("source");
      const output = document.getElementById("output");
      const runButton = document.getElementById("run");

      const render = () => {
        const result = run(source.value);
        output.textContent = result.log.join("\n\n");
      };

      runButton.addEventListener("click", render);
      render();
    </script>
  </body>
</html>
