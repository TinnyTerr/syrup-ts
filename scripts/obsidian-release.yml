name: release
# push a tag matching manifest.json's version (no leading v) to publish; Obsidian wants main.js, manifest.json, styles.css as assets
on:
  push:
    tags: ["*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - run: |
          test "$(jq -r .version manifest.json)" = "${GITHUB_REF_NAME}" || { echo "tag must equal manifest version"; exit 1; }
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
