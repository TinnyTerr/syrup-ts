name: release

# Push a tag vX.X.X equal to "v" + manifest.json's version to publish. No plugin source lives here:
# the release checks out TinnyTerr/syrup-ts at the same tag, compiles it with plugin/, and attaches
# main.js, manifest.json and styles.css (the three files Obsidian installs).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match manifest version
        run: test "v$(jq -r .version manifest.json)" = "$GITHUB_REF_NAME" || { echo "tag must be v + manifest version"; exit 1; }

      - uses: actions/checkout@v4
        with:
          repository: TinnyTerr/syrup-ts
          ref: ${{ github.ref_name }}
          path: syrup

      - uses: oven-sh/setup-bun@v2

      - name: Stage build (syrup source + syrup's lockfile, plugin from this repo)
        run: |
          mkdir build
          cp -r plugin build/
          cp -r syrup/src syrup/shared build/
          cp syrup/package.json syrup/bun.lock build/
          cd build && bun install --frozen-lockfile

      - name: Compile
        working-directory: build
        run: bun build plugin/main.ts --outfile main.js --target node --format cjs -e obsidian -e electron

      - name: Publish
        run: |
          cp build/main.js .
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
