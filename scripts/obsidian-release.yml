name: release

# Push a tag vX.X.X equal to "v" + manifest.json's version to publish. No plugin source lives here:
# the release checks out TinnyTerr/syrup-ts at the same tag, compiles it with plugin/, and attaches
# main.js, manifest.json and styles.css (the three files Obsidian installs).
on:
  workflow_dispatch:
    inputs:
      version:
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match manifest version
        run: test "$(jq -r .version manifest.json)" = "${{ inputs.version }}" || { echo "tag must be version"; exit 1; }

      - uses: actions/checkout@v4
        with:
          repository: TinnyTerr/syrup-ts
          ref: ${{ github.ref_name }}
          path: syrup

      - uses: oven-sh/setup-bun@v2

      - name: Stage build (syrup source + syrup's lockfile, plugin from this repo)
        run: |
          mkdir build
          cp -r plugin build/
          cp -r syrup/src syrup/shared build/
          cp syrup/package.json syrup/bun.lock build/
          cd build && bun install --frozen-lockfile

      - name: Compile
        working-directory: build
        run: bun build plugin/main.ts --outfile main.js --target node --format cjs -e obsidian -e electron

      - name: Place built main.js beside the release assets
        run: cp build/main.js .

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish
        run: |
          gh release create "${{ inputs.version }}" main.js manifest.json styles.css --title "${{ inputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
